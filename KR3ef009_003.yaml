body:
  text: 卷下方一麻黃湯麻黃六錢桂枝四錢甘草二錢杏仁七枚上作二帖水二鍾煎八分取汁麻黃性熱惟冬及春兼病人素虛寒者乃用正方夏至之後服之必發斑黃須加知母半兩石膏一兩黃芩一分桂枝加減月令同二桂枝湯桂枝芍藥各二錢半甘草一錢半上作一帖姜三片棗一枚煎服取微汗倍加芍藥名桂枝芍藥湯加大黃名桂枝大黃湯金匱方曰太陽病自汗而小便數者不可與桂枝湯三桂枝葛根湯桂枝芍藥甘草各二錢半生薑四錢大棗二枚葛根五錢二分上作二服水煎取微汗四葛根湯葛根一兩四錢麻黃三錢生薑三錢桂枝甘草芍藥各二錢棗一枚上作二帖水煎服衣覆取汗為度五升麻葛根湯升麻乾葛芍藥甘草各三錢上作二服水煎若大段寒即熱服若熱即溫服身涼為度六大青龍湯麻黃石膏各四錢半桂枝一錢半甘草同上杏仁三枚上作二帖姜三片棗一枚水煎取微汗不可太過恐亡陽以溫粉撲之七小青龍湯半夏六分北五味一錢二分麻黃芍藥細辛甘草乾薑桂枝各一錢八分上作二帖生薑四片水煎諸方皆不用生薑八大柴胡湯柴胡三錢黃芩一錢半大黃七錢芍藥錢半半夏一錢枳實二錢上作一帖生薑五片棗一枚煎大柴胡合三一承氣湯合黃連解毒湯合大承氣湯九小柴胡湯柴胡八錢黃芩甘草人參各三錢半夏二錢半上五錢生薑五片棗一枚煎溫服一法本方合涼膈天水一法本方合涼膈散一法本方合解毒湯一法本方去棗子加牡蠣一法本方去人參大棗生薑加五味子乾薑一法本方去半夏人參加栝蔞實十大承氣湯大黃芒硝各二錢厚朴四錢枳實三枚上作一帖水二鍾先煎厚朴枳實次下大黃煎取八分去滓入硝煎一二沸放溫服一法本方加甘遂末一錢匕十一調胃承氣湯大黃三錢芒硝二錢甘草一錢半上作一帖水二鍾煎溫服十二小承氣湯大黃三錢厚朴一錢半枳實一錢上作一帖水二鍾煎溫服十三三一承氣湯大黃二錢芒硝一錢半厚朴錢半枳實一錢甘草二錢上作一帖水煎溫服一法本方減硝加貫衆紫河車入金銀煎名銀煎散一法本方加當歸薑棗名當歸承氣湯十四桃仁承氣湯桃仁去皮尖十枚芒硝錢半大黃二錢桂甘草各一錢半上作一帖水煎空心服十五犀角地黃湯犀角白芍藥牡丹皮各五分生地黃四錢上作一帖水煎有熱加黃芩一錢發狂血證加大黃本方無大黃血證內有十六大陷胸湯大黃二錢芒硝二錢半甘遂一分些小便是上作一帖水煎溫服未快再服勢惡不利以意加之十七大陷胸丸大黃半兩芒硝二錢半葶藶三錢炒另研杏仁十二枚炒上大黃末下葶藶杵羅研杏仁芒硝如泥丸如彈子大每服一丸入甘遂末三字白蜜半匙水一鍾煎至半鍾溫服當一宿未利再服十八小陷胸湯半夏四錢黃連二錢栝蔞實一枚四分用之二上作一帖水煎溫服未利再服微利黃涎即愈一法本方合小柴胡湯十九抵當湯水蛭炒虻蟲各七個去足翅炒杏仁七枚大黃二錢半上作二帖水煎再服二十抵當丸水蛭炒虻蟲各七個去足翅炒杏仁七枚大黃二錢半上細末煉蜜作二丸用水二鍾煎一丸至六分溫服晬時血未下再服二十一黃連解毒湯黃連黃柏黃芩梔子每服五錢水煎溫服本方合大承氣湯一法本方加枳殼本方合三一承氣湯一法本方加甘遂末一錢匕本方合調胃承氣湯一法本方合涼膈天水散二十二白虎湯金匱方云太陽病無汗而渴者不可服知母一兩半甘草一兩粳米一合石膏四兩上五錢水煎溫服一法本方加蒼朮一法本方加人參蒼朮一法本方加半夏橘皮一法本方加半夏桔梗一法本方合解毒湯一法本方加人參白朮一法本方合涼膈散一法本方加麻黃根浮麥二十三涼膈散連翹一兩黃芩半兩梔子半兩甘草半兩朴硝一分薄荷大黃各半兩上五錢水煎入蜜少許一法本方合解毒湯一法本方加滑石一法本方加桔梗枳殼一法本方合天水散一法本方加滑石調五苓散二十四五苓散金匱方云陽明病汗多而渴者不可服豬苓茯苓白朮各五錢桂心一分澤瀉一兩上或調或煎一法本方加生薑汁調服二十五淡滲湯即五苓合益元是也二十六瓜蒂散瓜蒂細銼炒赤小豆等分又用茶少許上為末豆豉半合水一盞半煮汁半盞調下一錢匕不吐加服頭痛加鬱金脅痛加蠍梢二十七三聖散見吐門食前先食齏汁半盞後調藥服一半用鵝翎探引吐出如吐少更以熱齏汁投之不已用麝香煎湯服半盞立止二十八梔子湯大梔子七枚豆豉半合上以水煎梔子至一盞半入豆豉煮至半盞溫服二十九梔子柏皮湯大梔子十五枚黃柏半兩甘草兩錢半上㕮咀水二鍾煎三十梔子厚朴湯大梔子七枚厚朴半兩枳實二錢上㕮咀水煎三十一十棗湯芫花大戟甘遂等分上為末水一盞棗十枚劈開煮汁半盞調藥末半錢匕實者一錢匕三十二茵陳湯茵陳一兩大黃半兩梔子十枚上五錢水煎本方合陷胸湯本方合大承氣湯本方五分陷胸湯三分大承氣二分本方合解毒湯三十三大黃黃連瀉心湯大黃黃連黃芩等分上五錢水煎一法加生薑甚良三十四桂苓甘露飲即五苓散加寒水石石膏上為末或溫湯或新水生薑湯調或煎一方不用豬苓一方加甘草一方有人參藿香木香葛根滑石甘草共一十三味一名桂苓白朮散三十五人參石膏湯人參二錢半白朮半兩知母半兩黃芩三錢川芎半兩茯苓半兩半夏二錢山梔三錢甘草一兩石膏三兩上㕮咀姜煎三十六崔宣武人參石膏湯人參二錢石膏一兩川芎二兩黃芩二錢茯苓防風各三錢甘草五錢上五錢水煎三十七半夏橘皮湯半夏陳皮甘草人參茯苓厚朴各三錢半葛根半兩上五錢姜五片水煎三十八茯苓半夏湯茯苓半夏生薑各一錢取汁素問藥證用水一大盞煎至四分絞汁卻下生薑汁服上水煎一方加黃芩甘草陳皮各一錢三十九大橘皮湯陳皮甘草各一兩人參二兩上五錢姜三片水煎四十赤茯苓湯陳皮甘草各一兩人參二兩半夏白朮川芎赤茯苓各半兩上五錢姜五片水煎四十一檳榔散檳榔枳殼等分上為末三錢黃連煎湯調下或黃連解毒湯調下或瀉心湯調下四十二白朮散白朮茯苓人參藿香各半兩甘草葛根各一兩木香二錢半上末白湯調下二錢熱加滑石或加生薑四十三四逆湯甘草一錢乾薑一分附子中者半個水煎溫服四十四五味子湯五味子半兩麥門冬人參杏仁陳皮各二錢上五錢薑棗煎四十五不臥散川芎一兩半石膏七錢半藜蘆半兩甘草人參細辛各二錢半上為末口噙水搐鼻少時飲白湯半碗汗出而解一方無人參細辛四十六川芎湯川芎藁本蒼朮等分上為末湯調三錢須臾嘔汗便解四十七柴胡飲子柴胡人參甘草大黃當歸芍藥上銼五錢姜五片水煎崔宣武加半夏五味子桔梗四十八劉庭瑞方柴胡甘草各二兩黃芩當歸芍藥各一兩人參半夏大黃各半兩大勞熱五七分以為度四十九比金散荊芥麻黃白芷細辛何首烏菊花防風石膏川芎薄荷全蠍草烏上為末各等分每服一錢煎服或茶酒送下五十調胃散水銀舶上硫黃上研至黑服一錢米飲下重者二錢五十一通神散河間另有六神通解散於此加麻黃髮汗最佳和劑方中蔥白散於此去黃芩滑石加川芎白朮乾葛亦妙方也蒼朮石膏各四兩甘草黃芩各二兩滑石六兩五十二益元散即天水散或名六一散滑石六兩甘草一兩上為末水調或加蜜或蔥豉湯調一名天水散一名六一散五十三通聖散防風川芎當歸芍藥大黃薄荷麻黃連翹芒硝各半兩石膏一兩黃芩桔梗各一兩滑石一兩甘草二兩荊芥白朮梔子各二錢半上銼五錢姜五片水煎五十四雙解散益元散通聖散各半兩上一兩薑蔥豉水煎五十五黃連香薷飲香薷一兩厚朴半兩白扁豆二錢半黃連三錢上銼五錢入酒少許水煎冷服五十六治腰腳骨節痛不止用威靈仙煎酒食前溫服極妙五十七無憂丸治一切食積氣積茶積酒積瀉痢氣蠱腹脹膨悶肚腹疼痛黑牽牛一斤取末十三兩檳榔好者二兩豬牙皂角二兩三稜二兩莪朮二兩各用好醋浸濕紙裹煨香熟取出切碎上同前藥曬乾為末又用大皂角二兩煎湯打麵糊為丸每服二錢半白湯送下茶亦可薑湯下五十八太乙神針羌活獨活黃連各四兩為末麝香二錢乳香二錢上用三月三日艾四月八日亦可曬乾打茸入前藥末和勻用好白紙捲包前藥如箸大治風痹或在腿或在腰在肱灸七炷二七炷三七炷甚效五十九治風蟲牙疼方防風去蘆草烏去尖細辛去葉巴豆去殼油上各味等分為細末擦牙痛處涎出立止切勿咽下如食飲食以鹽湯灌漱飲無礙六十神效追蟲取積感應丸檳榔半斤樟柳根半斤貫衆半斤大黃半斤三稜四兩醋煮雷丸四兩醋煮莪朮二兩醋煮使君子四兩取肉木香二兩芫花一兩苦楝根皮八兩黑牽牛二斤半取頭末十兩為衣皂角茵陳藿香自檳榔至牽牛為末外用皂角等三味濃煎汁為丸如梧桐子大每服三錢重六十一金刀如聖散茅山蒼朮六兩米泔浸一日一夜白芷二兩川烏四兩去皮臍生用防風四兩淨生用細辛三兩去土淨白朮二兩五錢草烏四兩本方用兩頭尖無則以川芎四兩雄黃五兩另研細末入藥上件俱各生用曬乾為末用一切金瘡及多年惡瘡用自己小便洗過貼藥立效破傷風緊急用好酒調藥半錢或一錢服之蛇傷入枯白礬少許調藥敷之蠍蜇傷用吐服蓋之汗也如汗不出再服或涎出亦驗傷處敷藥可瘋狗咬傷處口噙水洗淨將藥貼傷處湯火燙傷者以新汲水調藥敷之雷頭風並乾溼癬麻痹每服半錢服之立效六十二蘆薈丸小兒痞疾疳癆肚大腹脹面黃肌瘦脾胃不和驚積食積並皆治之蘆薈麥糵胡黃連各一兩黃連五錢蕪荑肉豆蔻木香龍膽草各四錢川楝子五十個取肉三稜蓬朮各六錢檳榔八錢使君子六十個陳皮青皮各八錢麝香一錢半神麯一兩半干蝦蟆一枚上為細末薄荷豬膽汁為丸粟米大每服一錢空心米湯下六十三無價寶一名壯陽丹專治五勞七傷四肢無力腳腿沉困骨節痠疼面目無光陽痿不起下元虛冷夢失精液服至十夜面目光滑二十夜老轉少年一月後陽道復原四十夜增進飲食至一百日萬病皆除冬不寒夏不熱鬚髮不白婦人服之強陰暖子宮陰陽有益最有功效川楝子二兩牛膝一兩酒浸檳榔一兩菟絲子一兩另研酒浸蛇床子一兩乾薑五錢穿山甲一大片酥炙蓮肉一兩不去心乳香三錢另研沉香五錢另研白檀香五錢另研鹿茸一兩炙巴戟一兩大茴香一兩仙靈脾三錢破故紙五錢鳳眼草三錢葫蘆巴五錢人參一兩澤瀉一兩山藥一兩五味子一兩熟地黃二兩麥門冬肉蓯蓉茯苓以上各一兩白芍藥五錢上二十七味除乳香沉香白檀香菟絲子四味另研為細末其餘二十三味各搗爛為細末同前四味煉蜜為劑同搗一二百千杵丸如梧桐子大每服三十丸增至九十丸好酒送下以乾物壓之修合之日再加丁香一錢六十四膏藥方松脂三斤麻油半斤穿山甲白芨二味各少許做點藥萆麻四十九粒研細六十五定子藥白礬一兩火煅同信一處信五錢乳香二錢沒藥二錢辰砂五分麵糊為定六十六生肌散龍骨火煅赤石脂火煅各半兩乳香沒藥海螵蛸輕粉全蠍洗焙乾各一錢血竭二錢黃丹一錢上為末待瘡頭落盡此藥填滿在瘡口上以膏藥貼之一日甘草湯洗二次膏藥一二日一換六十七追風托裡散甘草黃耆當歸芍藥白芷防風川芎官桂栝蔞仁金銀花桔梗每服水酒共二鍾煎至一鍾空心服六十八象牙丸象牙五錢蜂房三錢蟬蛻三錢木香三錢沒藥一錢乳香三錢全蠍一隻殭蠶三錢先將黃蠟半斤化開待黑色過卻將前藥為細末入蠟內攪勻傾入水內取出冷定為丸如棗大每服空心一丸滾酒化開連三日三服待藥從漏痕出隔三日再一服第五日再服一丸後下定子藥傷寒用藥加減賦萬物之生也人為最靈四時有變兮百疾兆生欲辨陰陽之證必明天地之情稽寒溫表裡之疑式明標本施汗下補吐之法溥濟群生始而毫毛次傳膚腠惡風自汗乃桂枝之證喘熱惡寒則麻黃之候陰陽俱虛而身必癢各半同功桂枝麻黃各半湯代寒熱共作而脈尚虛二一共湊桂枝二越婢一湯於是助以薑棗雜以豉蔥便利惡風者乾薑心悸腹痛者建中脈熱極而煩者入人參於白虎脈煩盛而喘者加杏子以青龍結胸下利而表解朱雀取效頭眩肉瞤而水泄玄武當功致使橘梗寬咽甘草平悸腹內脹滿兮厚朴姜心中懊憹兮梔子豉小便不利則投之以豬苓膈間有痰則吐之以瓜蒂或乃熱作而腹脅脹滿又若狂妄而潮熱發悸或里已入而表未除或小便澀而大便祕必明大小柴胡直敘前後承氣結胸多渴祝侍者議任陷胸譫語發狂委將軍即大黃功先調胃當知青龍十棗兮水分表里三黃四逆兮利有寒溫下利者通脈煩躁者茯苓茯苓四逆湯脈絶用當歸當歸四逆湯亡血須人參四逆加人參汗出加附子附子瀉心湯惡風入黃芩黃芩瀉心湯脅下有水則生薑生薑瀉心湯心中嘔逆則人參人參瀉心湯上四者總歸於四逆下四者類同於瀉心溫寒實而解結胸美三白之功妙生津液而逐水道嘉五苓之用深唾血則黃耆宜服便膿則桃仁可加黃疸茵陳必先求之瓜蒂先瓜蒂後茵陳斑毒紫雪當後用於升麻先升麻後紫雪溫濕之於桂附蒼朮可入理中之內參姜附子宜加此外若青龍與柴胡有加減之餘議身有餘熱者桂枝須加脅下硬滿者大棗可去多汗者附子加小柴胡奔豚者桂枝加桂喘者小青龍加杏仁嗽者小柴胡加五味瓜蒂治煩渴未除茯苓醫小便不利內寒者茱萸外腫者防己生薑止嘔半夏療噦用枳殼兮緣酒毒留胸有黃柏兮因衄血出鼻或得人參以除煩或取茯苓而愈悸頭痛如破蔥白連須咳逆欲絶乾柿並蒂下利則乾薑身痛則梔豉豈二方之獨用亦衆藥之同推妙哉吾今精此四十餘年活人之功嘗識
