body:
  text: 卷上傷風傷風之證頭疼項強肢節煩疼或目痛肌熱乾嘔鼻塞手足溫自汗出惡風其脈陽浮而緩陰浮而弱此風邪在表以上傷風之證皆宜桂枝湯第二以解肌傷風汗出怕風而加項強痛者桂枝葛根湯第三傷風反無汗者雖已服桂枝湯反煩不解而無里證者先刺風池風府卻與桂枝湯服之不若通用雙解散五十四免致有桂枝麻黃之誤傷風自汗白虎湯二十二太陽病無汗而渴者不可與白虎湯傷寒傷寒之證頭項病疼腰脊強身體拘急惡寒不煩躁無自汗或致頭面目疼肌熱鼻乾或胸滿而喘手足指末微厥脈浮數而緊者邪在表以上傷寒之證皆宜麻黃湯第一以發其汗傷寒冒風頭目痛四肢拘倦比金散四十九不若通用天水散五十二或雙解散五十四之類甚佳無使藥不中病而益加害也白虎合涼膈散二十三乃調理傷寒之上藥傷風甚妙中暑中暑之證身熱頭痛背寒面垢自汗煩躁大渴口乾倦怠而身不痛或時惡寒或畏日氣脈虛而弱無問表裡通宜白虎夏月感冒發熱煩渴五苓散二十四桂苓甘露飲三十四黃連香薷飲五十五或雙解散五十四或裡熱甚腹滿而脈沉可下者大承氣湯十下之或三一承氣湯十三尤妙半表半裡者小柴胡九合涼膈天水散中濕中濕之證一身盡疼重者發黃關節煩疼發熱鼻塞時或腹滿脹大便利脈沉而緩以上中濕之證先用雙解散五十四微微汗之次用五苓散二十四或淡滲散二十五桂苓甘露飲三十四曾用甘露飲不愈卻用黃連解毒二十一則愈問何也曰若劑生土之甘此屬土故以火劑燥土其病則愈風寒俱中風寒俱中之證頭痛項強肢體疼手足溫為中風反無汗惡寒脈浮緊為傷寒也或頭項疼腰脊強身體拘急指末微厥不自汗為傷寒反煩躁而脈緩者為傷風也風則傷衛寒則傷榮榮衛俱傷則表裡熱甚者通宜以大青龍湯六或雙解散五十四最妙內外傷寒始得脈便沉而里病表和者內傷也脈浮而表病里和者外傷也病在身體四肢為表病病在胸腹之內為里病內傷通神散五十一外傷雙解散五十四內外一切所傷通聖散五十三然不若雙解散以平和為之三法至神一切汗候風寒暑濕飢飽勞逸憂愁思慮恚恐悲怒四時中外諸邪所傷但覺身熱頭疼拘倦強痛無問自汗無汗憎寒發熱渴與不渴微甚傷寒疫癘汗病兩感風氣雜病一切舊病發作三日裡外並宜雙解散五十四設若感之勢甚本難解者常服雙解散三兩日間亦漸可減並無所損或裡熱極甚腹滿實痛煩渴譫妄須可下者三一承氣湯十三為妙或下後未愈或下證未全或大汗前後逆氣或汗後餘熱不解或遺熱復勞或染他人病氣汗毒傳染或中瘴氣羊氣牛氣一切穢毒並漆毒酒毒食毒一切藥毒及墜墮打撲傷損疼痛或久患風眩頭疼中風偏枯破傷風洗頭風風癇病或婦人産後諸疾小兒驚風積熱瘡瘍疹痘無問日數但以雙解散五十四服之周身中外氣血宣通病皆除愈然雙解乃通仙之藥但除孕婦及産後月經過多並泄瀉者勿與服之惟年老人最宜自有造化於中矣傳染凡傷寒疫癘之病何以別之蓋脈不浮者傳染也設若以熱藥解表不惟不解其病反甚而危殆矣其治之法自汗宜以蒼朮白虎湯二十二無汗宜滑石涼膈散二十三散熱而愈其不解者通其表裡微甚隨證治之而與傷寒之法皆無異也雙解散五十四益元散五十二皆為神方表證凡表證脈浮身體肢節疼痛惡風惡寒者可汗之不可下也傷寒無汗麻黃湯一傷風自汗桂枝湯二一法不問風寒通用雙解散五十四或天水散五十二最妙里證凡里證脈實而不浮不惡寒及惡風身不疼自汗譫語不大便或咽乾腹滿者可下之不可汗也以上之證宜小承氣湯十二大承氣湯十調胃承氣湯十一選而用之一法不問風寒暑濕或表里兩證俱不見但無表證而有可下者通用三一承氣湯十三下之此藥發峻效使無表熱入里而無結胸及痞之衆疾也或熱結極深而諸藥數下畢竟不能利不救成死者大承氣湯加甘遂一錢匕下之病在裡脈沉細者無問風寒暑濕或表裡證俱不見或內外諸邪所傷有汗無汗心腹痛滿譫妄煩躁蓄熱內盛但是脈沉者宜三一承氣湯十三合解毒湯二十一下之解毒調胃承氣湯能瀉大熱表裡證表裡俱見之證或半在表或半在裡之證者謂前表裡二證病在相參有欲汗之而有里病欲下之而表病未解汗之不可吐之又不可法當和解傷風白虎湯二十二傷寒中風或兩感小柴胡湯九一法不問風寒暑濕用涼膈散二十三天水散五十二二藥合一服用煎解之或表熱多裡熱少天水一涼膈半或裡熱多表熱少涼膈一天水半表熱極里有微熱身疼頭痛或眩或嘔不可汗吐下者天水涼膈散合和解之解之又不能退其熱者用黃連解毒湯表裡之熱俱微者五苓散二十四表裡之熱俱盛者大柴胡湯八微下之更甚者大柴胡合大承氣湯十下之雙除表裡之熱服雙解散五十四之後若不解病已傳變後三日在裡法當下之殊不知下之太早則表熱乘虛而入里遂成結胸虛痞懊憹發黃之證輕者必危危者必死但宜平和之藥宣散其表和解其里病勢或有汗而愈或無汗氣和而愈用小柴胡九涼膈二十三天水五十二合和主之病在半表半裡用小柴胡涼膈散合和而解之或小柴胡合解毒湯二十一如服熱勢未退者大柴胡八合三一承氣湯十三表裡俱微半表半裡若里微者宜大柴胡八合黃連解毒湯二十一合服諸小柴胡湯證後病不解表裡熱勢更甚而心下急郁微煩或發熱汗出不解心下痞硬嘔吐不利或陽明病多汗或少陰病下利清水心下痛而口乾或太陰病腹滿而痛或無表裡證但發熱七八日雖脈浮而數而脈在肌肉實數而滑者並宜大柴胡湯八病至七八日裡熱已甚表漸微脈雖浮數用三一承氣湯十三合解毒下之下證未全不可下者用白虎湯二十二或人參石膏湯三十五脈洪躁里有微熱不可汗者用黃連解毒湯二十一汗後不解凡是表證法當汗之依法汗之其病又不解汗後不解其證前後別無異證者通宜涼膈散二十三調之以退其熱無使熱甚危極也除此之外遠勝小柴胡湯兩感至此而已汗後餘熱用益元散五十二或小柴胡湯九崔宣武人參石膏湯三十六傷寒大發汗汗出不解反無汗脈尚浮者蒼朮白虎湯二十三解之傷寒用桂枝湯發汗後半日許復熱煩脈浮者再宜桂枝湯二汗後不解下證未全者白虎湯二十三汗後煩躁不得眠微熱而渴五苓散二十四汗後不解裡外有熱口乾煩渴柴胡飲子四十七解表之後尚未愈者解毒二十一涼膈二十三天水散五十二能調順陰陽洗滌臟腑下後不解凡是里證法當下之依法下之其病又不解或大下後或再三下後熱勢尚甚而不退本氣虛損而不能實擬更下之恐下脫而立死不下之則熱極而死寒涼諸藥不能退其熱勢之甚者或濕熱內余下利不止熱不退者或因大下後濕熱利不止而熱不退脈弱氣虛不可更下者或諸濕熱內余小便赤澀大便溏泄頻並少腹而急痛者必欲作痢也通宜黃連解毒湯二十一以解之傷寒下之太過胃中無熱飲水無力白朮散四十二又有大下之後其熱不退再三下之熱愈甚若下之不止其人脈微氣虛氣弱不加以法無可生之理至此下之亦死不下亦死但用涼膈二十一合解毒湯二十三調之陽熱退除陰脈漸生為之妙法下之前後無問日數餘熱不解小柴胡湯九汗下後胃虛大橘皮湯三十九汗下後胸膈滿悶赤茯苓湯四十在上湧之諸病在膈者當用瓜蒂散二十六吐之或表證罷邪熱入里結於胸中煩滿而飢不能食四肢微厥而脈乍急者宜瓜蒂散吐之傷寒頭疼久不愈令人喪明以胸膈有宿痰故也當先湧之次以白虎湯二十二加減在下泄之諸病蓄熱下焦則承氣抵當之類泄之而可也合病三陽合病腹滿身重難以轉側口燥面垢譫語遺尿如誤發汗則譫語益甚下之則便厥額上汗出後必發黃白虎湯二十二兩感兩感謂一日太陽少陰兩症俱見二日陽明與太陰俱病三日少陽與厥陰俱病前六經之證是也小柴胡湯九涼膈散二十三五苓散二十四天水散五十二通聖散五十三雙解散五十四大柴胡湯八可選用之熱勢甚欲可下者三一承氣湯十三或解毒二十一合承氣湯痓病痓之為病發熱腹滿口噤頭搖瘛瘲不語項強背直腰身反強或目痛或目赤或目閉或反目或足溫或妄行其脈沉弦而遲或帶緊者無汗曰剛痓有汗曰柔痓通宜三一承氣湯十三合解毒二十一下之頭疼頭疼之證無問風寒暑濕雜病自汗頭疼俱宜白虎湯二十二或加川芎荊芥尤妙頭疼久不愈必致喪明宜先湧痰次用白虎加減風眩痰逆喘嗽頭疼茯苓半夏湯三十八頭疼肢體痛黃連解毒湯二十一頭疼口乾桂苓甘露飲三十四風疾喘嗽頭疼白虎二十二半夏橘皮湯三十七風熱頭疼心煩昏憒人參石膏湯三十五傷寒壯熱頭疼不臥散四十五身疼身疼之證無問風寒雙解散五十四表熱甚頭項肢體疼痛黃連解毒湯二十一傷寒瘟疫遍身疼痛少力頭旋腰腳麻重嘔噦壯熱減食三一承氣十三減硝加貫衆紫河車入金銀煎名銀煎散中濕一身盡痛五苓散二十四腹脹滿痛腹脹滿脈沉者以三一承氣湯十三合解毒二十一下之諸腹滿實痛煩渴譫妄脈實數而沉者無問日數三一承氣湯少陽證腹中痛者小柴胡九去黃芩加芍藥湯少陽證脅下痞硬者小柴胡去棗子加牡蠣太陰證腹滿時痛桂枝二加芍藥痛甚桂枝加大黃往來寒熱往來寒熱屬少陽一日二三作來往無期用小柴胡湯九主之潮熱潮熱屬陽明一日一發日晡而作也陽明裡熱極甚或吐下後不解大便五六日至十餘日日晡潮熱心胸煩熱而懊憹如瘧狀脈沉實者三一承氣湯十三陽明少陽合病下利日晡發熱如瘧者大柴胡湯八通宜三一承氣十三合解毒二十一自汗自汗者不發表解肌自出汗也傷風自汗也傷風自汗桂枝湯傷寒自汗脈沉數而實表裡俱熱者三陽合病自汗者厥逆自汗者頭疼自汗者傷寒自汗未解半入於裡者中暑自汗脈虛者俱宜白虎湯二十二傷寒寢汗不止白虎湯加麻黃根浮麥傷寒汗下後自汗脈虛熱不已白虎加人參蒼朮服之汗止身涼通仙之法也中暑自汗白虎湯後以淡滲湯二十五調之自汗多崔宣武人參石膏湯三十六自利並誤下自利者不經下藥攻裡而自利也脈浮表不解自利或小便不利者五苓散二十四一切瀉痢間作桂苓甘露飲三十四溫濕內甚而作痢者黃連解毒湯二十一或自利清水色鈍青心下痞痛口燥者皆濕熱相搏於腸胃之內而成三一承氣湯十三當汗而反下及不成結胸而但下利清穀不化表證在表熱裡寒也急以四逆湯四十三溫里利止里和急以桂枝解表或用巴豆熱藥下之而協熱利不止皆宜五苓散止利兼解表小便不利小便不利者小便難而赤澀也中暑並傷寒大發汗後胃中干煩躁不得眠脈浮小便不利微熱煩渴者口乾煩渴小便不利者小便赤澀通宜五苓散二十四桂苓甘露飲三十四主之嘔吐凡嘔吐者火性上炎也無問表裡通宜涼膈散二十三傷寒雜病一切嘔吐調胃承氣湯十一煩悶乾嘔黃連解毒湯二十一嘔吐煩渴者桂苓甘露飲三十四五苓散二十四眩咳嘔者白虎二十二加半夏橘皮傷寒嘔吐四肢厥逆清冷調胃散五十濕溫內甚噁心嘔吐者白虎合解毒湯吐瀉吐瀉者上吐下瀉亦名霍亂也一切吐瀉霍亂通宜五苓散二十四益元散五十二白朮散四十二吐瀉霍亂煩渴並中外諸邪所傷而吐瀉腹滿痛悶者並皆桂苓甘露飲三十四淡滲湯二十五喘嗽大熱喘嗽而滿者黃連解毒湯二十一或熱甚咳嗽悶亂三一承氣湯十三少陽咳者小柴胡九去人參大棗生薑加五味子乾薑喘嗽頭疼者茯苓半夏湯三十八咳嗽者白虎湯二十二加半夏桔梗咳嗽不已人參石膏湯三十五或崔宣武人參石膏湯三十六痰逆咳嗽半夏橘皮湯三十七汗之後氣悶咳嗽五味子湯四十四渴凡口乾煩渴者傷寒汗出而渴者飲水反吐名曰水逆俱宜五苓散二十四少陰病二三日口燥咽乾三一承氣湯十三或裡熱燥甚傷寒怫鬱留飲不散煩渴不止則腹高起痛不可忍但嘔冷涎大渴不能飲飲亦不能止其渴喘急悶亂但欲死者三一承氣湯下咽立止其渴有若無病之人須臾大汗而愈至此往往多有不利而汗出亦有藥力但隨汗之宣通不利而愈或汗吐下後煩渴口乾脈浮大白虎湯二十二加人參煩躁多渴涼膈散二十三加滑石煩躁傷寒煩躁多渴涼膈散二十三加滑石中暑傷寒汗後煩躁五苓散二十四一切火熱狂躁喘滿黃連解毒湯二十一煩躁而渴白朮散四十二或加滑石甚者加薑汁懊憹虛煩不得眠懊憹煩心反復顛倒不得眠者煩熱怫鬱於內而氣不能宣通也或胸滿結痛或煩微汗出虛煩者梔子湯二十八主之或氣少者加甘草一錢或嘔者及初誤以丸藥下者加生薑半兩凡懊憹虛煩者皆用涼膈散二十三甚佳及宜湯濯手足使心胸結熱宣散而已心煩腹滿坐臥不安梔子厚朴湯三十主之或陽明病下之後躁熱而懊憹者三一承氣湯十三汗後煩躁不得眠五苓散二十四或涼膈散二十三口燥呻吟錯語不得眠五苓散黃連解毒湯二十一煩心者涼膈散少陽證胸中煩而不嘔者小柴胡九去半夏人參加栝蔞實主之留飲一切留飲不散五苓散二十四桂苓甘露飲三十四黃連解毒湯二十一涼膈散二十三白虎湯二十二小陷胸湯十八三一承氣湯十三選用傷寒表未罷心下有水氣乾嘔發熱而咳或嘔或利或噎或小便不利小腹滿或喘者小青龍湯七痞傷寒表裡俱熱下證未全法當和解誤下之早則成痞心下痞滿而不痛按之虛軟者痞脈浮而尚惡寒者表未解也當先桂枝二解表已而後用大黃黃連瀉心湯三十三攻痞也或只用五苓散二十四使除表裡甚良或痞惡寒而汗出者或痞而煩小便不利者或痞留飲濕熱下利者或已成痞因其痞滿誤更下之其痞轉甚嘔噦下利心煩躁者無問脈浮沉並宜生薑煎湯調下五苓散二十四頻服之或痞不已則後亦濕熱煩滿或譫妄脈沉無他證者宜大黃黃連瀉心湯三十三或小陷胸湯十八亦可下早成痞檳榔散四十一結胸結胸之證有三不按而痛者名大結胸按之而痛者名小結胸心下怔忡頭汗出者名水結胸也汗下之後不大便五六日舌乾而渴日脯少有潮熱從心下至小腹硬滿而痛不可近而脈沉緊滑數或但關脈沉緊者宜大陷胸湯十六或陷胸丸十七下之或脈浮者表未罷也不可下下之則死宜小陷胸湯十八及小柴胡湯九之類和解之表罷者方可下之或結胸雖脈浮而裡熱勢惡須可下者宜三一承氣湯十三分作三次約三時許服訖得利甚良雖未稍減脈必沉病微者只用三一承氣半服按法而下之裡熱甚者以大陷胸湯十六大半服而下之或但結胸別無大段熱證但頭微汗出脈沉潛者水結胸也通宜大陷胸丸十七小結胸心下按之而痛脈浮而滑別無大段熱證及水結胸者小陷胸湯十八傷寒下之太早結胸黃連解毒湯二十一加枳殼傷寒結胸虛痞涼膈散二十三加枳殼桔梗或但自熱結胸者其胸高起腹雖不滿而但喘急悶結譫妄昏冒關脈沉數而緊者用大承氣湯七加甘遂一錢匕下之表證罷熱入里結於胸中煩滿而飢不能食微厥而脈乍緊者瓜蒂散吐之二十六太陽中風下利嘔逆表證罷乾嘔短氣不惡寒漐漐汗出發作有時頭痛心下痞硬滿引脅下痛者十棗湯三十一結胸而發黃者茵陳湯三十二陷胸湯十六各半服下之協熱下利不止更結胸發黃茵陳湯五分陷胸湯三分大承氣湯二分下之為佳脈浮不可下者小陷胸湯合小柴胡湯九血證太陽病日深表證仍在循經熱蓄於下焦脈微而沉不結胸而發狂者熱在下焦小腹當硬滿小便自利也血下而愈宜攻之或太陽病身黃脈沉者循經而蓄熱下焦也小腹硬小便不利為無血小便自利如狂者瘀血症或陽明蓄熱內甚而喜忘或狂大便雖硬而反易其色黑者有蓄血也或無表裡證但發熱日深脈浮者亦可下或已下後脈數胃熱消穀善飢數日不大便有瘀血也並宜抵當湯十九下之傷寒有熱小腹滿小便自利者為有血也當下未敢用湯用抵當丸二十最為穩當太陽病不解而蓄熱下焦先以桂枝解表已而下血宜桃仁承氣湯十四或抵當丸二十攻之傷風汗下不解熱鬱經絡隨氣湧泄為衄或清道閉流入胃脘吐出清血及鼻衄吐血不盡余血停留以致面黃大便黑犀角地黃湯十五發狂加黃芩大黃譫語譫語發狂三一承氣湯十三合解毒湯二十一下之若傷寒過經譫語已有熱也當以湯下之若小便利大便當硬而下利脈和者醫以丸藥下之非其治也若自利者脈當厥今反和此為內實調胃承氣湯十一或涼膈散二十三通用發黃陽明病表熱極甚煩滿熱鬱留飲不散以致濕熱相搏而身體發黃其候但頭汗出身無汗齊頸而還小便不利渴飲水漿者身體發黃宜茵陳湯三十二調下五苓散二十四結胸而發黃者茵陳同陷胸湯十六各半下之或誤服熱毒丸藥下之反損陰氣遂協熱利不止更或結胸而發黃者用茵陳湯五分陷胸湯三分承氣湯十一分下之或兩感發黃者用茵陳湯加黃連解毒湯二十一一服急下之頭微汗小便利而發微黃者濕熱微也梔子柏皮湯二十九發黃甚者茵陳合三一承氣湯十三發斑發斑下證未全涼膈散二十三未曾下胃熱發斑白虎湯二十二加人參白朮陽明胃熱發斑脈沉須下者三一承氣湯十三下之傷寒胃熱發斑涼膈散加滑石調五苓散二十四甚妙傷寒七八日發黃有斑微熱腹滿者或痰實壅上雖諸承氣湯不過者仲景曰寸脈浮滑者可用瓜蒂散二十六吐之發狂傷寒發狂奔走罵詈不避親疏此陽有餘陰不足三一承氣湯十三加當歸薑棗名當歸承氣湯以利數行候微緩以三聖散二十七吐之後用涼膈散二十三黃連解毒湯二十一調之譫妄發狂逾垣上屋赴井投河皆為陽熱極甚用三一承氣合解毒下之驚悸癲狂三一承氣湯發狂極甚投河入井者三下不過不可攻下便當湧之以瓜蒂散二十六吐出痰涎宿物一掃而愈後以甘露飲三十四之類調之發戰凡熱病大汗將出而反寒戰者表之正氣與邪氣並甚於里火熱亢極而反兼水化制之反為寒戰脈微欲絶者三一承氣湯十三或十棗湯三十一下之凡欲作汗無問病之微甚或已經新下者或下證未全者但以涼膈散二十三調之甚者黃連解毒湯二十一或下後二三日或未經下腹滿煩渴脈沉實而有里證者三一承氣湯下之勢惡者加黃連解毒湯或戰不快者或戰後汗出不快者或戰數次經大戰而汗不當者乃並之太甚而法之不達通宜三一承氣湯或更加黃連解毒湯下之以解怫熱而開鬱結也發厥或發熱極甚而恐承氣不能退者或已下後而熱不退者或蓄熱內甚陽厥極深以陽氣怫鬱不能營運於身表四肢以致通身清冷痛甚不堪項背拘急目青睛疼昏眩恍惚咽乾或痛躁渴虛汗嘔吐下利腹滿實痛煩冤悶亂喘急鄭聲脈雖疾數以其蓄熱極深而脈道不利反致脈沉細而欲絶俗未明其造化之理而反謂其傷寒極陰毒者或始得之陽熱暴甚而便有此證候者或兩感熱勢甚者通宜解毒二十一加大承氣湯十下之熱不退者宜再下之雖古人云三下之而熱未退即死矣然亦有按法以下三五次利一二十行熱方退而得活者免致不下退其熱而必死也下後熱少退而未愈者黃連解毒湯調之或失下熱極以致身冷脈微而昏冒將死者若急下之殘陰暴絶而死蓋陽氣後竭而然也不下亦死宜涼膈散二十三或黃連解毒湯或二藥合服或白虎二十二合涼膈散養陰退陽積熱漸以宣散則心胸溫暖脈漸以生至於脈復有力方可以三一承氣湯十三下之或解毒加六一散五十二調之愈後宜服退熱之藥忌發熱諸物裡熱脈厥者宜白虎湯熱極厥深而諸藥下畢竟不能利者不救必死黃連解毒湯更加甘遂末一錢匕下之循衣摸床陽明病脈遲汗出不惡寒身重短氣狂語如見鬼狀劇者發則不識入循衣摸床惕而不安直視微喘三一承氣湯十三勞復食復汗下後勞復柴胡飲子四十七飲酒復劇黃連解毒湯二十一或雙解五十四加黃連在裡者三一承氣湯十三在表者益元散五十二或雙解半表半裡大柴胡湯八小柴胡湯九涼膈散二十三解毒湯二十一隨證用之食復三一承氣湯
